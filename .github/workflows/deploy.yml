name: Full DevOps Pipeline

on:
  push:
    branches: [main]

jobs:
  devsecops-pipeline:
    runs-on: ubuntu-latest

    steps:
      # -------- CHECKOUT CODE --------
      - name: Checkout code
        uses: actions/checkout@v3

      # -------- SETUP NODE --------
      - uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage || true

      # -------- SETUP JAVA --------
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # -------- INSTALL SONAR SCANNER --------
      - name: Install SonarQube Scanner
        run: |
          sudo apt-get update && sudo apt-get install -y unzip curl
          curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          if [ -f sonar-scanner.zip ]; then
            unzip -q sonar-scanner.zip
            mv sonar-scanner-* sonar-scanner
            chmod +x sonar-scanner/bin/sonar-scanner
            echo "${{ github.workspace }}/sonar-scanner/bin" >> $GITHUB_PATH
          else
            echo "Error: sonar-scanner.zip not found!"
            exit 1
          fi

      # -------- RUN SONAR SCAN --------
      - name: Run SonarCloud Scan
        run: |
          sonar-scanner \
            -Dsonar.projectKey=pharma-point-dashboard \
            -Dsonar.organization=stutig123 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.sources=. \
            -Dsonar.branch.name=main \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------- TRIVY SCAN --------
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .

      # -------- ANSIBLE DEPLOY --------
      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Add SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Deploy with Ansible
        run: ansible-playbook -i inventory.ini deploy.yml --private-key key.pem
